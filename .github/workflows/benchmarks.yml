name: Benchmarks

on:
  push:
    branches: [main, kani-clawd]
    paths:
      - "kani-clawd/**"
      - "scripts/kani-*.sh"
      - ".github/workflows/benchmarks.yml"
  workflow_dispatch:

jobs:
  agent-flow:
    name: kani agent flow
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: kani-clawd
      - name: Install Kani
        run: |
          cargo install --locked kani-verifier
          cargo kani setup
      - name: Agent flow proofs (timed)
        run: |
          start=$(date +%s)
          ./scripts/kani-agent-flow.sh | tee agent-flow.log
          echo "total_seconds=$(( $(date +%s) - start ))" | tee -a agent-flow.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-flow-benchmark
          path: agent-flow.log
